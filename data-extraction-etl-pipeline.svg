<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Data Extraction and ETL Pipeline</title><desc id="desc">A workflow that collects data from files, APIs, websites, and databases before transforming and loading it into SQLite.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071229"/><stop offset="1" stop-color="#17395d"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
  <rect width="1200" height="720" fill="url(#bg)"/><g font-family="Arial, sans-serif">
    <text x="70" y="76" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="4">DATA ENGINEERING PROJECT</text><text x="70" y="127" fill="#f8fafc" font-size="38" font-weight="700">Data Extraction &amp; ETL Pipeline</text><text x="70" y="158" fill="#9cb5d0" font-size="18">Collecting structured and web data, transforming news titles, and loading results to SQLite</text>
    <rect x="70" y="205" width="1060" height="94" rx="18" fill="#102646" stroke="#31557d"/><g fill="#8fa8c6" font-size="14" font-weight="700"><text x="108" y="240">SOURCES</text><text x="418" y="240">EXTRACTION</text><text x="710" y="240">TRANSFORMATION</text><text x="978" y="240">DESTINATION</text></g><g fill="#f8fafc" font-size="23" font-weight="700"><text x="108" y="276">CSV · JSON · API · Web</text><text x="418" y="276">Python tools</text><text x="710" y="276">Uppercase titles</text><text x="978" y="276">SQLite</text></g><path d="M380 221V282M670 221V282M932 221V282" stroke="#31557d"/>
    <text x="70" y="361" fill="#dbeafe" font-size="21" font-weight="700">End-to-end ETL workflow</text>
    <rect x="70" y="397" width="220" height="190" rx="18" fill="#102646" stroke="#31557d"/><text x="102" y="442" fill="#f8fafc" font-size="19" font-weight="700">Extract</text><g fill="#a9bdd7" font-size="16"><text x="102" y="483">CSV &amp; JSON files</text><text x="102" y="516">REST API requests</text><text x="102" y="549">Web scraping tables</text></g>
    <path d="M310 492H370" stroke="#60a5fa" stroke-width="4"/><path d="M361 482l15 10-15 10" fill="#60a5fa"/>
    <rect x="390" y="397" width="220" height="190" rx="18" fill="#102646" stroke="#31557d"/><text x="422" y="442" fill="#f8fafc" font-size="19" font-weight="700">Structure</text><g fill="#a9bdd7" font-size="16"><text x="422" y="483">Pandas DataFrames</text><text x="422" y="516">Parse tables &amp; JSON</text><text x="422" y="549">Select news titles</text></g>
    <path d="M630 492H690" stroke="#60a5fa" stroke-width="4"/><path d="M681 482l15 10-15 10" fill="#60a5fa"/>
    <rect x="710" y="397" width="220" height="190" rx="18" fill="#102646" stroke="#31557d"/><text x="742" y="442" fill="#f8fafc" font-size="19" font-weight="700">Transform</text><g fill="#a9bdd7" font-size="16"><text x="742" y="483">Clean text fields</text><text x="742" y="516">Uppercase headlines</text><text x="742" y="549">Prepare table schema</text></g>
    <path d="M950 492H1010" stroke="#60a5fa" stroke-width="4"/><path d="M1001 482l15 10-15 10" fill="#60a5fa"/>
    <rect x="1030" y="397" width="100" height="190" rx="18" fill="url(#accent)"/><text x="1048" y="457" fill="#fff" font-size="18" font-weight="700">Load</text><text x="1048" y="497" fill="#e0f2fe" font-size="15">news.db</text><text x="1048" y="526" fill="#fff" font-size="14">SQLite</text>
    <text x="70" y="653" fill="#7f9abc" font-size="15">Tools used: requests, urllib, BeautifulSoup, Pandas, CSV/JSON modules, and SQLAlchemy</text>
  </g>
</svg>
