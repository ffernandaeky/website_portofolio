<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">Text preprocessing pipeline</title><desc id="desc">A flow from YouTube comments through text cleaning, tokenisation, VADER scoring, and sentiment groups.</desc><rect width="900" height="510" fill="#f8fafc"/><text x="55" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">Text preprocessing pipeline</text><text x="55" y="104" fill="#64748b" font-family="Arial, sans-serif" font-size="16">From raw YouTube comments to sentiment labels</text><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#e0f2fe" stroke="#38bdf8"><rect x="55" y="210" width="145" height="100" rx="16"/><rect x="270" y="210" width="145" height="100" rx="16"/><rect x="485" y="210" width="145" height="100" rx="16"/><rect x="700" y="210" width="145" height="100" rx="16"/></g><g fill="#0f172a" font-size="16" font-weight="700"><text x="127" y="248">YouTube</text><text x="127" y="272">comments</text><text x="342" y="248">Clean &amp;</text><text x="342" y="272">normalise</text><text x="557" y="248">Tokenise &amp;</text><text x="557" y="272">lemmatise</text><text x="772" y="248">VADER</text><text x="772" y="272">sentiment</text></g><g stroke="#2563eb" stroke-width="4" fill="none"><path d="M205 260h50"/><path d="M420 260h50"/><path d="M635 260h50"/></g><g fill="#2563eb"><path d="M255 253l12 7-12 7z"/><path d="M470 253l12 7-12 7z"/><path d="M685 253l12 7-12 7z"/></g></g><g font-family="Arial, sans-serif"><rect x="105" y="370" width="310" height="72" rx="14" fill="#dcfce7"/><text x="130" y="400" fill="#166534" font-size="16" font-weight="700">Positive</text><text x="130" y="426" fill="#166534" font-size="15">compound score ≥ 0</text><rect x="485" y="370" width="310" height="72" rx="14" fill="#ffe4e6"/><text x="510" y="400" fill="#9f1239" font-size="16" font-weight="700">Negative</text><text x="510" y="426" fill="#9f1239" font-size="15">compound score &lt; 0</text></g></svg>
