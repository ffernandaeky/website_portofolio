<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Rainfall forecasting with Exponential Smoothing</title><desc id="desc">A visual summary of the Exponential Smoothing forecasting and PyCaret classification workflow across 12 BMKG stations in East Java.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><path d="M0 500 Q180 395 360 500 T720 500 T1200 460 V675 H0Z" fill="#0f766e" opacity=".26"/><text x="70" y="82" fill="#99f6e4" font-family="Arial" font-size="20" font-weight="700" letter-spacing="3">BMKG EAST JAVA · 2024</text><text x="70" y="140" fill="white" font-family="Arial" font-size="42" font-weight="700">Rainfall Forecasting with Exponential Smoothing</text><text x="70" y="177" fill="#d1fae5" font-family="Arial" font-size="20">Rolling 7-day predictions paired with rainfall-intensity classification</text><g transform="translate(70 235)"><rect width="445" height="315" rx="20" fill="white" opacity=".97"/><text x="30" y="48" fill="#334155" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">TIME-SERIES FORECAST</text><text x="30" y="94" fill="#0f172a" font-family="Arial" font-size="27" font-weight="700">Exponential Smoothing</text><text x="30" y="128" fill="#64748b" font-family="Arial" font-size="17">Per-station, rolling forecast horizon: 7 days</text><path d="M32 250 C72 190 116 265 158 222 S238 179 278 223 S350 260 405 158" fill="none" stroke="#0d9488" stroke-width="10" stroke-linecap="round"/><path d="M32 274 H410" stroke="#e2e8f0" stroke-width="2"/><g fill="#0f766e" font-family="Arial" font-size="17" font-weight="700"><text x="32" y="300">12 BMKG stations</text><text x="245" y="300">366 observations/station</text></g></g><g transform="translate(550 235)"><rect width="580" height="315" rx="20" fill="#0f172a" opacity=".87"/><text x="30" y="48" fill="#99f6e4" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">END-TO-END WORKFLOW</text><g font-family="Arial" text-anchor="middle"><g fill="#134e4a"><circle cx="92" cy="150" r="51"/><circle cx="251" cy="150" r="51"/><circle cx="410" cy="150" r="51"/><circle cx="510" cy="150" r="51"/></g><g fill="white" font-size="18" font-weight="700"><text x="92" y="145">Clean</text><text x="92" y="168">data</text><text x="251" y="145">Forecast</text><text x="251" y="168">7 days</text><text x="410" y="145">Classify</text><text x="410" y="168">intensity</text><text x="510" y="145">Map</text><text x="510" y="168">results</text></g></g><path d="M147 150 H196 M306 150 H355 M465 150 H459" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/><text x="30" y="256" fill="#d1fae5" font-family="Arial" font-size="20">PyCaret compares and tunes classifiers after the forecast output is labelled.</text><text x="30" y="291" fill="#99f6e4" font-family="Arial" font-size="16">Decision Tree · Gradient Boosting · XGBoost · CatBoost · and more</text></g></svg>
