<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Rainfall forecasting with Exponential Smoothing</title>
  <desc id="desc">A visual summary of the Exponential Smoothing forecasting and PyCaret classification workflow across 12 BMKG stations in East Java.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><path d="M0 500 Q180 395 360 500 T720 500 T1200 460 V675 H0Z" fill="#0f766e" opacity=".26"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="82" fill="#99f6e4" font-size="20" font-weight="700" letter-spacing="3">BMKG EAST JAVA &#183; 2024</text>
    <text x="70" y="140" fill="white" font-size="42" font-weight="700">Rainfall Forecasting with Exponential Smoothing</text>
    <text x="70" y="177" fill="#d1fae5" font-size="20">Rolling 7-day predictions paired with rainfall-intensity classification</text>
    <g transform="translate(70 235)">
      <rect width="445" height="315" rx="20" fill="white" opacity=".97"/>
      <text x="30" y="48" fill="#334155" font-size="15" font-weight="700" letter-spacing="2">TIME-SERIES FORECAST</text>
      <text x="30" y="94" fill="#0f172a" font-size="27" font-weight="700">Exponential Smoothing</text>
      <text x="30" y="128" fill="#64748b" font-size="17">Per-station, rolling forecast horizon: 7 days</text>
      <path d="M32 250 C72 190 116 265 158 222 S238 179 278 223 S350 260 405 158" fill="none" stroke="#0d9488" stroke-width="10" stroke-linecap="round"/><path d="M32 274 H410" stroke="#e2e8f0" stroke-width="2"/>
      <g fill="#0f766e" font-size="15" font-weight="700"><text x="32" y="300">12 BMKG stations</text><text x="230" y="300">366 observations/station</text></g>
    </g>
    <g transform="translate(550 235)">
      <rect width="580" height="315" rx="20" fill="#0f172a" opacity=".87"/>
      <text x="30" y="48" fill="#99f6e4" font-size="15" font-weight="700" letter-spacing="2">END-TO-END WORKFLOW</text>
      <path d="M168 106 H362 M405 149 V157 M362 200 H168" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g text-anchor="middle"><g fill="#134e4a"><circle cx="125" cy="106" r="43"/><circle cx="405" cy="106" r="43"/><circle cx="405" cy="200" r="43"/><circle cx="125" cy="200" r="43"/></g><g fill="white" font-size="16" font-weight="700"><text x="125" y="101">Clean</text><text x="125" y="121">data</text><text x="405" y="101">Forecast</text><text x="405" y="121">7 days</text><text x="405" y="195">Classify</text><text x="405" y="215">intensity</text><text x="125" y="195">Map</text><text x="125" y="215">results</text></g></g>
      <text x="30" y="269" fill="#d1fae5" font-size="15">Label forecast output, then compare classifiers.</text>
      <text x="30" y="295" fill="#99f6e4" font-size="13">Decision Tree &#183; Gradient Boosting &#183; XGBoost &#183; CatBoost</text>
    </g>
  </g>
</svg>
