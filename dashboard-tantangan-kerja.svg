<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard Tantangan Kerja Indonesia 2022</title>
  <desc id="desc">Ringkasan klaster tantangan kerja pada 514 kabupaten dan kota di Indonesia.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071229"/><stop offset="1" stop-color="#17395d"/></linearGradient></defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g font-family="Arial,sans-serif">
    <text x="70" y="78" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="4">POWER BI DASHBOARD</text>
    <text x="70" y="127" fill="#f8fafc" font-size="37" font-weight="700">Indonesia Employment Challenges 2022</text>
    <text x="70" y="157" fill="#9cb5d0" font-size="18">TPT and TPAK clustering by city and regency</text>
    <rect x="70" y="202" width="1060" height="96" rx="18" fill="#102646" stroke="#31557d"/>
    <g fill="#8fa8c6" font-size="14" font-weight="700"><text x="105" y="237">DATA COVERAGE</text><text x="458" y="237">OPTIMAL CLUSTER</text><text x="720" y="237">SILHOUETTE SCORE</text><text x="967" y="237">DATA YEAR</text></g>
    <g fill="#f8fafc" font-size="30" font-weight="700"><text x="105" y="274">514 kabupaten/kota</text><text x="458" y="274">K = 3</text><text x="720" y="274">0.467</text><text x="967" y="274">2022</text></g><path d="M423 218V281M684 218V281M930 218V281" stroke="#31557d"/>
    <rect x="70" y="330" width="610" height="318" rx="20" fill="#102646" stroke="#31557d"/><text x="104" y="375" fill="#dbeafe" font-size="21" font-weight="700">Employment-challenge clusters</text><path d="M125 575H630M125 430H630" stroke="#31557d"/>
    <rect x="182" y="535" width="92" height="40" rx="8" fill="#22c55e"/><rect x="352" y="420" width="92" height="155" rx="8" fill="#f59e0b"/><rect x="522" y="435" width="92" height="140" rx="8" fill="#ef4444"/>
    <g fill="#d9e8fb" font-size="19" font-weight="700"><text x="192" y="525">42</text><text x="360" y="410">246</text><text x="530" y="425">226</text></g><g fill="#b8cae1" font-size="16"><text x="184" y="608">Low</text><text x="351" y="608">Medium</text><text x="530" y="608">High</text></g>
    <rect x="716" y="330" width="414" height="318" rx="20" fill="#102646" stroke="#31557d"/><text x="750" y="375" fill="#dbeafe" font-size="21" font-weight="700">Cluster characteristics</text>
    <circle cx="775" cy="439" r="8" fill="#ef4444"/><text x="797" y="445" fill="#f8fafc" font-size="18" font-weight="700">High</text><text x="797" y="471" fill="#9cb5d0" font-size="15">Higher TPT / lower TPAK</text>
    <circle cx="775" cy="521" r="8" fill="#f59e0b"/><text x="797" y="527" fill="#f8fafc" font-size="18" font-weight="700">Medium</text><text x="797" y="553" fill="#9cb5d0" font-size="15">Medium TPT and TPAK</text>
    <circle cx="775" cy="599" r="8" fill="#22c55e"/><text x="797" y="605" fill="#f8fafc" font-size="18" font-weight="700">Low</text><text x="797" y="631" fill="#9cb5d0" font-size="15">Lower TPT / higher TPAK</text>
  </g>
</svg>
