<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Exponential Smoothing evaluation workflow</title><desc id="d">A diagram showing data cleaning, forecasting, intensity labelling, model comparison, and map output.</desc><rect width="900" height="520" fill="#f0fdfa"/><text x="52" y="67" fill="#134e4a" font-family="Arial" font-size="30" font-weight="700">From station records to rainfall-intensity insight</text><text x="52" y="100" fill="#47766f" font-family="Arial" font-size="17">Workflow documented in the Exponential Smoothing notebook</text><g font-family="Arial" text-anchor="middle"><g fill="#0f766e"><rect x="57" y="184" width="145" height="133" rx="20"/><rect x="263" y="184" width="145" height="133" rx="20"/><rect x="469" y="184" width="145" height="133" rx="20"/><rect x="675" y="184" width="145" height="133" rx="20"/></g><g fill="white" font-size="19" font-weight="700"><text x="129" y="234">Prepare</text><text x="129" y="261">station data</text><text x="335" y="234">Forecast</text><text x="335" y="261">next 7 days</text><text x="541" y="234">Assign</text><text x="541" y="261">intensity class</text><text x="747" y="234">Compare</text><text x="747" y="261">classifiers</text></g></g><g stroke="#2dd4bf" stroke-width="6" stroke-linecap="round"><path d="M213 250H244"/><path d="M419 250H450"/><path d="M625 250H656"/></g><g font-family="Arial" font-size="17"><text x="77" y="380" fill="#115e59">Missing values and duplicates checked</text><text x="278" y="380" fill="#115e59">Rolling per station</text><text x="471" y="380" fill="#115e59">≤4, ≤20, ≤50, ≤100, &gt;100 mm</text><text x="694" y="380" fill="#115e59">Tuned final models</text></g><text x="52" y="462" fill="#47766f" font-family="Arial" font-size="15">The notebook also includes a forecast map interface to view results by date and station location.</text></svg>
