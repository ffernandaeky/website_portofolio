<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Agriculture IndoBERT classification platform</title>
  <desc id="desc">A visual summary of an Indonesian agricultural YouTube data pipeline and five-topic IndoBERT classifier.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14532d"/><stop offset=".55" stop-color="#166534"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#ecfdf5"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1090" cy="92" r="205" fill="#a3e635" opacity=".11"/><circle cx="108" cy="620" r="220" fill="#5eead4" opacity=".08"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="80" fill="#bbf7d0" font-size="19" font-weight="700" letter-spacing="3">FINAL PROJECT &#183; NLP PLATFORM</text>
    <text x="70" y="138" fill="white" font-size="44" font-weight="700">YouTube Agriculture</text>
    <text x="70" y="176" fill="#dcfce7" font-size="21">Turning Indonesian agricultural video content into structured, searchable insights</text>
    <g transform="translate(70 205)">
      <rect width="1060" height="195" rx="22" fill="url(#card)"/>
      <text x="30" y="35" fill="#166534" font-size="15" font-weight="700" letter-spacing="2">DATA PIPELINE</text>
      <g text-anchor="middle" fill="#dcfce7" stroke="#86efac" stroke-width="2"><rect x="30" y="55" width="150" height="80" rx="16"/><rect x="220" y="55" width="150" height="80" rx="16"/><rect x="410" y="55" width="150" height="80" rx="16"/><rect x="600" y="55" width="150" height="80" rx="16"/></g>
      <g text-anchor="middle" fill="#14532d" font-size="16" font-weight="700"><text x="105" y="88">YouTube</text><text x="105" y="111">API</text><text x="295" y="88">Clean</text><text x="295" y="111">text</text><text x="485" y="88">Label</text><text x="485" y="111">topics</text><text x="675" y="88">IndoBERT</text><text x="675" y="111">predict</text></g>
      <g stroke="#22c55e" stroke-width="4" stroke-linecap="round"><path d="M183 95H217"/><path d="M373 95H407"/><path d="M563 95H597"/></g>
      <text x="30" y="164" fill="#166534" font-size="18" font-weight="700">Web scraping &#8594; NLP preprocessing &#8594; classification &#8594; dashboard</text>
      <text x="30" y="186" fill="#4b6b57" font-size="14">Metadata video, titles, and descriptions are processed in Indonesian.</text>
    </g>
    <g transform="translate(70 425)">
      <rect width="1060" height="185" rx="22" fill="#0f172a" opacity=".9"/>
      <text x="30" y="35" fill="#86efac" font-size="15" font-weight="700" letter-spacing="2">FINAL EVALUATION</text>
      <text x="30" y="92" fill="white" font-size="54" font-weight="700">90.14%</text><text x="250" y="87" fill="#d1fae5" font-size="18">accuracy on the evaluation set</text>
      <path d="M30 112H1030" stroke="#365b4a"/>
      <text x="30" y="142" fill="#86efac" font-size="16" font-weight="700">4,260 labelled videos</text>
      <text x="30" y="166" fill="#cbd5e1" font-size="15">Five agricultural categories &#183; 426 evaluation samples</text>
      <g fill="#22c55e"><circle cx="39" cy="177" r="6"/><circle cx="230" cy="177" r="6"/><circle cx="400" cy="177" r="6"/><circle cx="555" cy="177" r="6"/><circle cx="700" cy="177" r="6"/></g>
      <g fill="#d1fae5" font-size="13"><text x="51" y="182">Pest control</text><text x="242" y="182">Fertilising</text><text x="412" y="182">Irrigation</text><text x="567" y="182">Organic</text><text x="712" y="182">Hydroponics</text></g>
    </g>
  </g>
</svg>
