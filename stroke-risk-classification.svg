<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Stroke Risk Classification with PyCaret</title>
  <desc id="desc">A visual summary of a stroke-risk classification workflow and Streamlit dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071229"/><stop offset="1" stop-color="#17395d"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102646"/><stop offset="1" stop-color="#15365b"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="76" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="4">MACHINE LEARNING PROJECT</text>
    <text x="70" y="127" fill="#f8fafc" font-size="38" font-weight="700">Stroke Risk Classification</text>
    <text x="70" y="158" fill="#9cb5d0" font-size="18">PyCaret AutoML pipeline with a Streamlit prediction dashboard</text>
    <rect x="70" y="205" width="1060" height="94" rx="18" fill="#102646" stroke="#31557d"/>
    <g fill="#8fa8c6" font-size="14" font-weight="700"><text x="108" y="240">TARGET</text><text x="401" y="240">DATA PREP</text><text x="699" y="240">MODEL WORKFLOW</text><text x="976" y="240">INTERFACE</text></g>
    <g fill="#f8fafc" font-size="23" font-weight="700"><text x="108" y="276">Stroke risk</text><text x="401" y="276">Drop ID + impute</text><text x="699" y="276">Compare + tune</text><text x="976" y="276">Streamlit</text></g>
    <path d="M365 221V282M666 221V282M935 221V282" stroke="#31557d"/>
    <rect x="70" y="339" width="480" height="300" rx="20" fill="url(#panel)" stroke="#31557d"/>
    <text x="105" y="385" fill="#dbeafe" font-size="21" font-weight="700">Patient inputs</text>
    <g fill="#a9bdd7" font-size="17"><text x="105" y="430">Age</text><text x="105" y="474">Hypertension &amp; heart disease</text><text x="105" y="518">Average glucose level &amp; BMI</text><text x="105" y="562">Lifestyle and demographic features</text></g>
    <g fill="#31557d"><rect x="378" y="411" width="128" height="15" rx="7"/><rect x="378" y="455" width="96" height="15" rx="7"/><rect x="378" y="499" width="128" height="15" rx="7"/><rect x="378" y="543" width="112" height="15" rx="7"/></g>
    <path d="M572 491H630" stroke="#60a5fa" stroke-width="4"/><path d="M621 481l15 10-15 10" fill="#60a5fa"/>
    <rect x="650" y="339" width="480" height="300" rx="20" fill="url(#panel)" stroke="#31557d"/>
    <text x="685" y="385" fill="#dbeafe" font-size="21" font-weight="700">Prediction dashboard</text>
    <rect x="685" y="414" width="174" height="164" rx="14" fill="#0b1d37" stroke="#31557d"/>
    <text x="711" y="453" fill="#8fa8c6" font-size="14" font-weight="700">MODEL OUTPUT</text><text x="711" y="492" fill="#f8fafc" font-size="24" font-weight="700">Stroke risk</text><text x="711" y="526" fill="#60a5fa" font-size="17">Classification label</text>
    <rect x="882" y="414" width="205" height="164" rx="14" fill="#0b1d37" stroke="#31557d"/>
    <path d="M907 538C935 516 949 491 975 495S1019 458 1058 441" fill="none" stroke="#38bdf8" stroke-width="5"/><path d="M907 550H1060M907 430V550" stroke="#31557d" stroke-width="2"/>
    <text x="907" y="610" fill="#8fa8c6" font-size="14">Age vs. average glucose</text>
    <text x="70" y="680" fill="#7f9abc" font-size="15">Educational project only — model output should not be used as a medical diagnosis.</text>
  </g>
</svg>
