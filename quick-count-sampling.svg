<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Tahapan sampling quick count</title><desc id="desc">Diagram tiga metode sampling yang digunakan untuk estimasi quick count.</desc><rect width="1200" height="720" fill="#0b1730"/><text x="75" y="88" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">SAMPLING DESIGN</text><text x="75" y="140" fill="#f8fafc" font-family="Arial,sans-serif" font-size="37" font-weight="700">Tiga pendekatan estimasi</text><g font-family="Arial,sans-serif"><path d="M294 370H444M616 370H766" stroke="#4b76a8" stroke-width="5" stroke-dasharray="10 10"/><g><rect x="75" y="234" width="220" height="272" rx="20" fill="#102646" stroke="#31557d"/><circle cx="116" cy="282" r="20" fill="#22c55e"/><text x="151" y="290" fill="#f8fafc" font-size="22" font-weight="700">01</text><text x="105" y="354" fill="#dbeafe" font-size="22" font-weight="700">Random</text><text x="105" y="383" fill="#dbeafe" font-size="22" font-weight="700">Sampling</text><text x="105" y="440" fill="#91a9c5" font-size="16">Mengambil sampel</text><text x="105" y="464" fill="#91a9c5" font-size="16">acak dari data TPS.</text></g><g><rect x="445" y="234" width="220" height="272" rx="20" fill="#102646" stroke="#31557d"/><circle cx="486" cy="282" r="20" fill="#3b82f6"/><text x="521" y="290" fill="#f8fafc" font-size="22" font-weight="700">02</text><text x="475" y="354" fill="#dbeafe" font-size="22" font-weight="700">Cluster</text><text x="475" y="383" fill="#dbeafe" font-size="22" font-weight="700">Sampling</text><text x="475" y="440" fill="#91a9c5" font-size="16">Mengelompokkan data</text><text x="475" y="464" fill="#91a9c5" font-size="16">berdasarkan wilayah.</text></g><g><rect x="815" y="234" width="310" height="272" rx="20" fill="#102646" stroke="#31557d"/><circle cx="856" cy="282" r="20" fill="#a855f7"/><text x="891" y="290" fill="#f8fafc" font-size="22" font-weight="700">03</text><text x="845" y="354" fill="#dbeafe" font-size="22" font-weight="700">Multistage</text><text x="845" y="383" fill="#dbeafe" font-size="22" font-weight="700">Sampling</text><text x="845" y="440" fill="#91a9c5" font-size="16">Memilih kelurahan lalu</text><text x="845" y="464" fill="#91a9c5" font-size="16">TPS secara bertahap.</text></g></g><text x="75" y="620" fill="#91a9c5" font-family="Arial,sans-serif" font-size="18">Tujuan: membandingkan stabilitas proporsi suara saat ukuran sampel meningkat.</text></svg>
