<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sumatra Rice Productivity SUR Analysis</title><desc id="desc">A Seemingly Unrelated Regression analysis of environmental factors and rice production in Sumatra.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071229"/><stop offset="1" stop-color="#17395d"/></linearGradient><linearGradient id="rice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs>
  <rect width="1200" height="720" fill="url(#bg)"/><g font-family="Arial, sans-serif">
  <text x="70" y="76" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="4">ECONOMETRICS PROJECT</text><text x="70" y="127" fill="#f8fafc" font-size="38" font-weight="700">Sumatra Rice Productivity Analysis</text><text x="70" y="158" fill="#9cb5d0" font-size="18">Seemingly Unrelated Regression (SUR) for environmental and agricultural factors</text>
  <rect x="70" y="205" width="1060" height="94" rx="18" fill="#102646" stroke="#31557d"/><g fill="#8fa8c6" font-size="14" font-weight="700"><text x="108" y="240">OBSERVATIONS</text><text x="386" y="240">PERIOD</text><text x="627" y="240">EQUATIONS</text><text x="910" y="240">MCELROY R²</text></g><g fill="#f8fafc" font-size="23" font-weight="700"><text x="108" y="276">224 records</text><text x="386" y="276">1993–2020</text><text x="627" y="276">2 SUR equations</text><text x="910" y="276">0.6765</text></g><path d="M348 221V282M586 221V282M866 221V282" stroke="#31557d"/>
  <rect x="70" y="338" width="510" height="305" rx="20" fill="#102646" stroke="#31557d"/><text x="104" y="385" fill="#dbeafe" font-size="21" font-weight="700">SUR system design</text><rect x="104" y="421" width="442" height="73" rx="12" fill="#0b1d37"/><text x="127" y="451" fill="#7dd3fc" font-size="15" font-weight="700">EQUATION 1</text><text x="127" y="479" fill="#f8fafc" font-size="17">Production ~ Harvested area + Rainfall</text><rect x="104" y="516" width="442" height="73" rx="12" fill="#0b1d37"/><text x="127" y="546" fill="#7dd3fc" font-size="15" font-weight="700">EQUATION 2</text><text x="127" y="574" fill="#f8fafc" font-size="17">Production ~ Humidity + Average temperature</text>
  <rect x="610" y="338" width="520" height="305" rx="20" fill="#102646" stroke="#31557d"/><text x="644" y="385" fill="#dbeafe" font-size="21" font-weight="700">Key coefficient results</text><text x="644" y="433" fill="#a9bdd7" font-size="15">Harvested area (Eq. 1)</text><text x="644" y="468" fill="url(#rice)" font-size="28" font-weight="700">+3.7288</text><text x="782" y="468" fill="#a9bdd7" font-size="15">p &lt; 0.001</text><path d="M644 490H1096" stroke="#31557d"/><text x="644" y="529" fill="#a9bdd7" font-size="15">Rainfall · Humidity · Temperature</text><text x="644" y="559" fill="#f8fafc" font-size="18" font-weight="700">Not statistically significant at 5%</text><text x="644" y="602" fill="#7f9abc" font-size="14">Robust covariance estimator · GLS system estimation</text>
  <text x="70" y="681" fill="#7f9abc" font-size="15">Variables: production, harvested area, rainfall, humidity, and average temperature across Sumatra provinces</text>
  </g>
</svg>
