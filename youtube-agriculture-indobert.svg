<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Agriculture IndoBERT classification platform</title><desc id="desc">A visual summary of an Indonesian agricultural YouTube data pipeline and five-topic IndoBERT classifier.</desc>
  <defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14532d"/><stop offset=".55" stop-color="#166534"/><stop offset="1" stop-color="#0f766e"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop stop-color="#ecfdf5"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#background)"/><circle cx="1090" cy="92" r="205" fill="#a3e635" opacity=".11"/><circle cx="108" cy="620" r="220" fill="#5eead4" opacity=".08"/>
  <text x="70" y="80" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">FINAL PROJECT · NLP PLATFORM</text><text x="70" y="138" fill="white" font-family="Arial, sans-serif" font-size="44" font-weight="700">YouTube Agriculture</text><text x="70" y="176" fill="#dcfce7" font-family="Arial, sans-serif" font-size="21">Turning Indonesian agricultural video content into structured, searchable insights</text>
  <g transform="translate(70 235)"><rect width="520" height="310" rx="22" fill="url(#card)"/><text x="30" y="48" fill="#166534" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">DATA PIPELINE</text><g font-family="Arial" text-anchor="middle"><g fill="#dcfce7" stroke="#86efac" stroke-width="2"><rect x="30" y="104" width="104" height="94" rx="16"/><rect x="154" y="104" width="104" height="94" rx="16"/><rect x="278" y="104" width="104" height="94" rx="16"/><rect x="402" y="104" width="88" height="94" rx="16"/></g><g fill="#14532d" font-size="16" font-weight="700"><text x="82" y="142">YouTube</text><text x="82" y="165">API</text><text x="206" y="142">Clean</text><text x="206" y="165">text</text><text x="330" y="142">Label</text><text x="330" y="165">topics</text><text x="446" y="142">IndoBERT</text><text x="446" y="165">predict</text></g></g><g stroke="#22c55e" stroke-width="4" stroke-linecap="round"><path d="M137 151H149"/><path d="M261 151H273"/><path d="M385 151H397"/></g><text x="30" y="250" fill="#166534" font-family="Arial" font-size="18" font-weight="700">Web scraping → NLP preprocessing → classification → dashboard</text><text x="30" y="278" fill="#4b6b57" font-family="Arial" font-size="16">Metadata video, titles, and descriptions are processed in Indonesian.</text></g>
  <g transform="translate(625 235)"><rect width="505" height="310" rx="22" fill="#0f172a" opacity=".88"/><text x="30" y="49" fill="#86efac" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">FINAL EVALUATION</text><text x="30" y="114" fill="white" font-family="Arial" font-size="58" font-weight="700">90.14%</text><text x="30" y="146" fill="#d1fae5" font-family="Arial" font-size="18">accuracy on the evaluation set</text><path d="M30 181H470" stroke="#365b4a"/><g font-family="Arial"><text x="30" y="222" fill="#86efac" font-size="16" font-weight="700">4,260 labelled videos</text><text x="30" y="253" fill="#cbd5e1" font-size="15">Five agricultural categories · 426 evaluation samples</text><g fill="#22c55e"><circle cx="39" cy="280" r="7"/><circle cx="168" cy="280" r="7"/><circle cx="280" cy="280" r="7"/><circle cx="373" cy="280" r="7"/><circle cx="456" cy="280" r="7"/></g><g fill="#d1fae5" font-size="12"><text x="51" y="284">Pest control</text><text x="180" y="284">Fertilising</text><text x="292" y="284">Irrigation</text><text x="385" y="284">Organic</text><text x="468" y="284">Hydroponics</text></g></g></g>
</svg>
