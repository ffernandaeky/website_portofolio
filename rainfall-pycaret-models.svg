<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">PyCaret classifier comparison</title><desc id="d">Cross-validation accuracy comparison of selected classifiers in the rainfall intensity project.</desc><rect width="900" height="520" fill="#f8fafc"/><text x="52" y="66" fill="#0f172a" font-family="Arial" font-size="30" font-weight="700">Rainfall intensity classification · cross-validation</text><text x="52" y="100" fill="#64748b" font-family="Arial" font-size="17">Mean accuracy from the notebook evaluation</text><g font-family="Arial" font-size="18" fill="#334155"><text x="52" y="178">CatBoost</text><text x="52" y="238">XGBoost</text><text x="52" y="298">LightGBM / SVM</text><text x="52" y="358">Logistic Regression</text><text x="52" y="418">Ridge Classifier</text></g><g><rect x="270" y="150" width="535" height="32" rx="16" fill="#2563eb"/><rect x="270" y="210" width="524" height="32" rx="16" fill="#3b82f6"/><rect x="270" y="270" width="521" height="32" rx="16" fill="#60a5fa"/><rect x="270" y="330" width="519" height="32" rx="16" fill="#93c5fd"/><rect x="270" y="390" width="518" height="32" rx="16" fill="#bfdbfe"/></g><g font-family="Arial" font-size="18" font-weight="700" fill="#0f172a"><text x="818" y="174">93.42%</text><text x="807" y="234">93.22%</text><text x="804" y="294">92.88%</text><text x="802" y="354">92.68%</text><text x="801" y="414">92.57%</text></g><text x="52" y="477" fill="#64748b" font-family="Arial" font-size="15">The project evaluates several classifiers after defining the intensity label from rainfall in millimetres.</text></svg>
