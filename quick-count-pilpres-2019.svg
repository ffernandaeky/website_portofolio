<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ringkasan quick count Pilpres 2019 Kalimantan Tengah</title><desc id="desc">Visualisasi proporsi suara dua pasangan calon dan golput sebagai data simulasi quick count.</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071229"/><stop offset="1" stop-color="#173962"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="720" fill="url(#b)"/><circle cx="1070" cy="90" r="250" fill="#38bdf8" opacity=".1"/>
  <text x="74" y="82" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">STATISTICAL SAMPLING PROJECT</text><text x="74" y="132" fill="#f8fafc" font-family="Arial,sans-serif" font-size="37" font-weight="700">Quick Count Pilpres 2019</text><text x="74" y="164" fill="#a9bed7" font-family="Arial,sans-serif" font-size="19">Kalimantan Tengah · estimasi proporsi suara</text>
  <g filter="url(#s)"><rect x="74" y="208" width="630" height="436" rx="22" fill="#102646" stroke="#31557d"/><text x="108" y="258" fill="#dbeafe" font-family="Arial,sans-serif" font-size="21" font-weight="700">Total suara provinsi</text>
  <g transform="translate(325 443) rotate(-90)"><circle r="132" fill="none" stroke="#234566" stroke-width="46"/><circle r="132" fill="none" stroke="#22c55e" stroke-width="46" stroke-dasharray="230 830"/><circle r="132" fill="none" stroke="#3b82f6" stroke-width="46" stroke-dasharray="149 830" stroke-dashoffset="-238"/><circle r="132" fill="none" stroke="#ef4444" stroke-width="46" stroke-dasharray="107 830" stroke-dashoffset="-395"/></g><text x="278" y="436" fill="#f8fafc" font-family="Arial,sans-serif" font-size="25" font-weight="700">1,753,224</text><text x="286" y="463" fill="#91a9c5" font-family="Arial,sans-serif" font-size="15">total data suara</text>
  <g font-family="Arial,sans-serif"><circle cx="517" cy="362" r="8" fill="#22c55e"/><text x="537" y="368" fill="#d9e8fb" font-size="17">Suara 1</text><text x="637" y="368" fill="#f8fafc" font-size="17" font-weight="700">830.948</text><circle cx="517" cy="424" r="8" fill="#3b82f6"/><text x="537" y="430" fill="#d9e8fb" font-size="17">Suara 2</text><text x="637" y="430" fill="#f8fafc" font-size="17" font-weight="700">537.138</text><circle cx="517" cy="486" r="8" fill="#ef4444"/><text x="537" y="492" fill="#d9e8fb" font-size="17">Golput</text><text x="637" y="492" fill="#f8fafc" font-size="17" font-weight="700">385.138</text></g></g>
  <g filter="url(#s)"><rect x="742" y="208" width="384" height="196" rx="22" fill="#102646" stroke="#31557d"/><text x="775" y="255" fill="#91a9c5" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">CAKUPAN WILAYAH</text><text x="775" y="322" fill="#f8fafc" font-family="Arial,sans-serif" font-size="53" font-weight="700">14</text><text x="775" y="354" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18">kabupaten/kota</text><rect x="742" y="438" width="384" height="206" rx="22" fill="#102646" stroke="#31557d"/><text x="775" y="484" fill="#91a9c5" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">PENDEKATAN</text><text x="775" y="530" fill="#dbeafe" font-family="Arial,sans-serif" font-size="20" font-weight="700">Random Sampling</text><text x="775" y="565" fill="#dbeafe" font-family="Arial,sans-serif" font-size="20" font-weight="700">Cluster Sampling</text><text x="775" y="600" fill="#dbeafe" font-family="Arial,sans-serif" font-size="20" font-weight="700">Multistage Sampling</text></g>
</svg>
