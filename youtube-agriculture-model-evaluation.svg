<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">IndoBERT model evaluation summary</title><desc id="desc">Evaluation metrics and class distribution for the YouTube Agriculture IndoBERT topic classifier.</desc>
  <rect width="900" height="520" fill="#f0fdf4"/><text x="52" y="66" fill="#14532d" font-family="Arial" font-size="30" font-weight="700">IndoBERT evaluation summary</text><text x="52" y="99" fill="#4b6b57" font-family="Arial" font-size="17">Best selected model: maximum 6 epochs, best inner epoch 3</text>
  <g transform="translate(52 142)"><rect width="238" height="160" rx="18" fill="white" stroke="#bbf7d0"/><text x="24" y="39" fill="#4b6b57" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1">EVALUATION ACCURACY</text><text x="24" y="103" fill="#15803d" font-family="Arial" font-size="49" font-weight="700">90.14%</text><text x="24" y="135" fill="#64748b" font-family="Arial" font-size="14">426 held-out examples</text></g>
  <g transform="translate(315 142)"><rect width="238" height="160" rx="18" fill="white" stroke="#bbf7d0"/><text x="24" y="39" fill="#4b6b57" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1">WEIGHTED F1</text><text x="24" y="103" fill="#15803d" font-family="Arial" font-size="49" font-weight="700">89.98%</text><text x="24" y="135" fill="#64748b" font-family="Arial" font-size="14">Final evaluation report</text></g>
  <g transform="translate(578 142)"><rect width="270" height="160" rx="18" fill="white" stroke="#bbf7d0"/><text x="24" y="39" fill="#4b6b57" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1">LABELLED DATA</text><text x="24" y="103" fill="#15803d" font-family="Arial" font-size="49" font-weight="700">4,260</text><text x="24" y="135" fill="#64748b" font-family="Arial" font-size="14">Nearly balanced across 5 topics</text></g>
  <text x="52" y="358" fill="#14532d" font-family="Arial" font-size="20" font-weight="700">Five topic labels</text><g font-family="Arial" font-size="16" font-weight="700"><rect x="52" y="385" width="148" height="42" rx="21" fill="#dcfce7"/><text x="70" y="412" fill="#166534">Pest control</text><rect x="214" y="385" width="132" height="42" rx="21" fill="#d1fae5"/><text x="234" y="412" fill="#166534">Fertilising</text><rect x="360" y="385" width="120" height="42" rx="21" fill="#ccfbf1"/><text x="382" y="412" fill="#0f766e">Irrigation</text><rect x="494" y="385" width="154" height="42" rx="21" fill="#ecfccb"/><text x="514" y="412" fill="#4d7c0f">Organic farming</text><rect x="662" y="385" width="136" height="42" rx="21" fill="#e0f2fe"/><text x="683" y="412" fill="#0369a1">Hydroponics</text></g><text x="52" y="475" fill="#64748b" font-family="Arial" font-size="15">Metrics sourced from the project’s saved final-training evaluation summary.</text>
</svg>
