<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Rainfall forecasting and classification with PyCaret</title><desc id="desc">A visual summary of the 7-day rainfall forecasting and intensity classification workflow across 12 BMKG stations in East Java.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#082f49"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient><linearGradient id="rain" x1="0" x2="0" y2="1"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><circle cx="1090" cy="90" r="190" fill="#38bdf8" opacity=".12"/><circle cx="100" cy="620" r="230" fill="#818cf8" opacity=".12"/>
  <text x="70" y="82" fill="#bae6fd" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">BMKG EAST JAVA · 2024</text><text x="70" y="140" fill="white" font-family="Arial, sans-serif" font-size="42" font-weight="700">Rainfall Forecasting with PyCaret</text><text x="70" y="177" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">7-day forecast and rainfall-intensity classification across BMKG stations</text>
  <g transform="translate(70 235)"><rect width="300" height="315" rx="20" fill="#ffffff" opacity=".96"/><text x="28" y="48" fill="#334155" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">FORECASTING</text><text x="28" y="99" fill="#0f172a" font-family="Arial" font-size="39" font-weight="700">12 stations</text><text x="28" y="132" fill="#64748b" font-family="Arial" font-size="17">Rolling 7-day forecasts</text><path d="M28 237 C65 185 83 255 116 205 S175 168 200 226 S245 190 270 150" fill="none" stroke="url(#rain)" stroke-width="9" stroke-linecap="round"/><path d="M28 275 H272" stroke="#e2e8f0" stroke-width="2"/><text x="28" y="296" fill="#2563eb" font-family="Arial" font-size="17" font-weight="700">PyCaret Time Series AutoML</text></g>
  <g transform="translate(405 235)"><rect width="300" height="315" rx="20" fill="#0f172a" opacity=".87"/><text x="28" y="48" fill="#93c5fd" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">VALIDATION</text><text x="28" y="102" fill="white" font-family="Arial" font-size="43" font-weight="700">MAE 1.34</text><text x="28" y="138" fill="#cbd5e1" font-family="Arial" font-size="17">Overall tuned-model evaluation</text><g fill="#38bdf8"><rect x="32" y="242" width="26" height="31" rx="5"/><rect x="75" y="207" width="26" height="66" rx="5"/><rect x="118" y="223" width="26" height="50" rx="5"/><rect x="161" y="175" width="26" height="98" rx="5"/><rect x="204" y="215" width="26" height="58" rx="5"/></g><text x="32" y="297" fill="#93c5fd" font-family="Arial" font-size="15">MAE · RMSE · MAPE per station</text></g>
  <g transform="translate(740 235)"><rect width="390" height="315" rx="20" fill="#ffffff" opacity=".96"/><text x="28" y="48" fill="#334155" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2">CLASSIFICATION</text><text x="28" y="89" fill="#0f172a" font-family="Arial" font-size="25" font-weight="700">Rainfall intensity categories</text><g font-family="Arial" font-size="17" font-weight="700"><rect x="28" y="119" width="150" height="38" rx="19" fill="#e0f2fe"/><text x="48" y="145" fill="#0369a1">No rain · ≤ 4 mm</text><rect x="195" y="119" width="132" height="38" rx="19" fill="#dcfce7"/><text x="215" y="145" fill="#15803d">Light · ≤ 20</text><rect x="28" y="174" width="150" height="38" rx="19" fill="#fef3c7"/><text x="48" y="200" fill="#b45309">Moderate · ≤ 50</text><rect x="195" y="174" width="132" height="38" rx="19" fill="#fee2e2"/><text x="215" y="200" fill="#b91c1c">Heavy · ≤ 100</text><rect x="28" y="229" width="150" height="38" rx="19" fill="#f3e8ff"/><text x="48" y="255" fill="#7e22ce">Very heavy · &gt;100</text></g><text x="28" y="297" fill="#2563eb" font-family="Arial" font-size="17" font-weight="700">Best CV: CatBoost · 93.42% accuracy</text></g>
</svg>
